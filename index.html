<!DOCTYPE html>
<html>
<head>
<title>DMD Equipment System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {margin:0;font-family:'Segoe UI';background:linear-gradient(135deg,#2c3e50,#4ca1af);}
#login {height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box {background:#fff;padding:40px;border-radius:16px;width:360px;text-align:center;}

.container {max-width:1200px;margin:20px auto;background:#fff;border-radius:14px;padding:20px;}

#summary {display:flex;gap:10px;margin-bottom:15px;}
#summary div {flex:1;padding:15px;border-radius:10px;color:#fff;text-align:center;font-weight:bold;}
#overdue{background:#e74c3c;} #soon{background:#f39c12;} #ok{background:#27ae60;}

.card {border:1px solid #ddd;border-radius:10px;padding:10px;margin-bottom:10px;}
.machine {border-left:5px solid #3498db;}

button {width:100%;padding:8px;margin-top:5px;border:none;border-radius:6px;background:#2c3e50;color:#fff;}
input,select,textarea {width:100%;padding:8px;margin-top:5px;box-sizing:border-box;}

.status.ok{color:green;font-weight:bold;}
.status.soon{color:orange;font-weight:bold;}
.status.overdue{color:red;font-weight:bold;}

.content{display:none;padding:10px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h2>Direct Mail Depot</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
</div>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

<h2>DMD Equipment Dashboard</h2>

<div id="summary">
<div id="overdue">Overdue: 0</div>
<div id="soon">Due Soon: 0</div>
<div id="ok">OK: 0</div>
</div>

<div class="card">
<h3>Add Machine</h3>

<select id="category">
<option>Screen Inkjet HD520 Digital Press</option>
<option>HP Indigo Digital Press</option>
<option>Laser</option>
<option>Inkjet</option>
<option>Inserting</option>
<option>Bindery</option>
<option>Affixing</option>
</select>

<input id="name" placeholder="Machine Name">
<input id="serial" placeholder="Serial Number">
<input id="date" type="date">

<button onclick="addMachine()">Add Machine</button>
</div>

<input id="search" placeholder="Search..." onkeyup="render()">

<button onclick="exportCSV()">Export Excel</button>
<button onclick="sendText()">Send Text</button>

<div id="list"></div>

<div style="text-align:center;margin-top:20px;font-size:12px;color:#777;">
© Clifford Kempadoo
</div>

</div>

<script>

const users={"Cliff":"DMD2026*"};
let currentUser="";

// 🔥 FULL DATA
let data = {
"DI001": {name:"SCREEN Truepress Jet520HD 1",serial:"DI001",type:"Screen Inkjet HD520 Digital Press",issues:[],next:""},
"DI002": {name:"SCREEN Truepress Jet520HD 2",serial:"DI002",type:"Screen Inkjet HD520 Digital Press",issues:[],next:""},
"HP001": {name:"HP Indigo Digital Press",serial:"HP001",type:"HP Indigo Digital Press",issues:[],next:""},
"LA001": {name:"Océ VarioStream 7450 #1",serial:"LA001",type:"Laser",issues:[],next:""},
"LA002": {name:"Océ VarioStream 7450 #2",serial:"LA002",type:"Laser",issues:[],next:""},
"LA003": {name:"Océ VarioStream 7450 #3",serial:"LA003",type:"Laser",issues:[],next:""},
"LA004": {name:"Océ VarioStream 7450 #4",serial:"LA004",type:"Laser",issues:[],next:""},
"IN001": {name:"MCS Hawk",serial:"IN001",type:"Inkjet",issues:[],next:""},
"IN002": {name:"Videojet 4320 #1",serial:"IN002",type:"Inkjet",issues:[],next:""},
"INS001": {name:"MSE Inserter 1",serial:"INS001",type:"Inserting",issues:[],next:""},
"INS002": {name:"Flowmaster RS Inserter",serial:"INS002",type:"Inserting",issues:[],next:""},
"BD001": {name:"Baum Folder 1",serial:"BD001",type:"Bindery",issues:[],next:""},
"AF001": {name:"Affixer System",serial:"AF001",type:"Affixing",issues:[],next:""}
};

// LOGIN
function login(){

let u = document.getElementById("user").value.trim();
let p = document.getElementById("pass").value.trim();

if(users[u] === p){
document.getElementById("login").style.display = "none";
document.getElementById("app").style.display = "block";
currentUser = u;
render();
}else{
alert("Wrong login");
}

}

// ADD
function addMachine(){
let name=document.getElementById("name").value.trim();
let serial=document.getElementById("serial").value.trim();
let type=document.getElementById("category").value;
let date=document.getElementById("date").value;

if(!name||!serial)return alert("Enter fields");

data[serial]={name,serial,type,issues:[],next:date};
render();
}

// RENDER
populateDropdown();  
function render(){
fixCategories();
let search=document.getElementById("search").value.toLowerCase();
list.innerHTML="";

let overdueCount=0, soonCount=0, okCount=0;

let types=[
"Screen Inkjet HD520 Digital Press",
"HP Indigo Digital Press",
"Laser",
"Inkjet",
"Inserting",
"Bindery",
"Affixing"
];

types.forEach(t=>{

let wrap=document.createElement("div");
let btn=document.createElement("button");
btn.innerText=t;

let content=document.createElement("div");
content.className="content";

btn.onclick=()=>content.style.display=content.style.display==="block"?"none":"block";

Object.values(data).forEach(e=>{

let type = (e.type || "").trim();

// force match category
if(type.includes("Screen")) type = "Screen Inkjet HD520 Digital Press";
else if(type.includes("HP")) type = "HP Indigo Digital Press";
else if(type.includes("Laser")) type = "Laser";
else if(type.includes("Inkjet")) type = "Inkjet";
else if(type.includes("Insert")) type = "Inserting";
else if(type.includes("Bind")) type = "Bindery";
else if(type.includes("Affix") || type.includes("Tab")) type = "Affixing";

// ONLY show if matches tab
if(type !== t) return;

if(search && !e.name.toLowerCase().includes(search) && !e.serial.toLowerCase().includes(search)) return;

let d=e.next?(new Date(e.next)-new Date())/86400000:999;
let status="OK",cl="ok";

if(d<0){status="OVERDUE";cl="overdue";overdueCount++}
else if(d<5){status="SOON";cl="soon";soonCount++}
else{okCount++}

let div=document.createElement("div");
div.className="card machine";

div.innerHTML=`
<b>${e.name} (${e.serial})</b><br>
Serial #: ${e.serial}<br>
<span class="status ${cl}">${status}</span><br>

<button onclick="editMachine('${e.serial}')">Edit</button>
<button onclick="deleteMachine('${e.serial}')">Delete</button>
<button onclick="showQR('${e.serial}')">QR</button>

${e.issues.join("<br>")}
`;

content.appendChild(div);
});

wrap.appendChild(btn);
wrap.appendChild(content);
list.appendChild(wrap);

});

document.getElementById("overdue").innerText="Overdue: "+overdueCount;
document.getElementById("soon").innerText="Due Soon: "+soonCount;
document.getElementById("ok").innerText="OK: "+okCount;
}

// EDIT PANEL
function editMachine(sn){

let e=data[sn];

let panel=document.createElement("div");
panel.style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;border-radius:10px;width:320px;z-index:9999;box-shadow:0 0 15px rgba(0,0,0,0.3);";

panel.innerHTML=`
<h3>Edit Machine</h3>
<select id="machineSelect" onchange="loadMachineFromDropdown()">
<option value="">Select Existing Machine</option>
</select>
<input id="edit_name" value="${e.name}">
<input id="edit_serial" value="${e.serial}">

<select id="edit_type">
<option ${e.type==="Screen Inkjet HD520 Digital Press"?"selected":""}>Screen Inkjet HD520 Digital Press</option>
<option ${e.type==="HP Indigo Digital Press"?"selected":""}>HP Indigo Digital Press</option>
<option ${e.type==="Laser"?"selected":""}>Laser</option>
<option ${e.type==="Inkjet"?"selected":""}>Inkjet</option>
<option ${e.type==="Inserting"?"selected":""}>Inserting</option>
<option ${e.type==="Bindery"?"selected":""}>Bindery</option>
<option ${e.type==="Affixing"?"selected":""}>Affixing</option>
</select>

<input id="edit_date" type="date" value="${e.next||""}">

<textarea id="edit_logs">${e.issues.join("\n")}</textarea>

<button onclick="saveEdit('${sn}')">Save</button>
<button onclick="this.parentElement.remove()">Cancel</button>
`;

document.body.appendChild(panel);
}

// SAVE EDIT
function saveEdit(oldSn){

let name=document.getElementById("edit_name").value.trim();
let serial=document.getElementById("edit_serial").value.trim();
let type=document.getElementById("edit_type").value;
let date=document.getElementById("edit_date").value;
let logs=document.getElementById("edit_logs").value.split("\n");

let old=data[oldSn];
delete data[oldSn];

data[serial]={name,serial,type,next:date,issues:logs,images:old.images||[]};

document.querySelector("div[style*='z-index:9999']").remove();
render();
}

// DELETE
function deleteMachine(sn){
if(confirm("Delete?")){
delete data[sn];
render();
}
}

// EXCEL
function exportCSV(){
let rows=[["Name","Serial","Category","Date","Logs"]];
Object.values(data).forEach(e=>{
rows.push([e.name,e.serial,e.type,e.next||"",e.issues.join(" | ")]);
});
let csv=rows.map(r=>r.join(",")).join("\n");
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="DMD_Report.csv";
a.click();
}

// SMS
function sendText(){
window.location.href="sms:17325551234?body=Machine needs attention";
}

// QR
function showQR(sn){
let url=location.href.split("#")[0]+"#machine="+sn;
window.open("https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(url));
}

document.getElementById("loginBtn").onclick = function(){

let u = document.getElementById("user").value.trim();
let p = document.getElementById("pass").value.trim();

if(u === "Cliff" && p === "DMD2026*"){
document.getElementById("login").style.display = "none";
document.getElementById("app").style.display = "block";
currentUser = u;
render();
}else{
alert("Wrong login");
}

};  
function fixCategories(){

Object.values(data).forEach(e=>{

if((e.type || "").includes("HP")) e.type = "HP Indigo Digital Press";
if((e.type || "").includes("Screen")) e.type = "Screen Inkjet HD520 Digital Press";

});

}
function populateDropdown(){

let select = document.getElementById("machineSelect");

select.innerHTML = '<option value="">Select Existing Machine</option>';

Object.values(data).forEach(e=>{
let opt = document.createElement("option");
opt.value = e.serial;
opt.text = e.name + " (" + e.serial + ")";
select.appendChild(opt);
});

}

function loadMachineFromDropdown(){

let sn = document.getElementById("machineSelect").value;
if(!sn) return;

let e = data[sn];

document.getElementById("name").value = e.name;
document.getElementById("serial").value = e.serial;
document.getElementById("date").value = e.next || "";

}  
</script>

</body>
</html>
