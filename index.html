<!DOCTYPE html>
<html>
<head>
  <title>Equipment Dashboard - Direct Mail Depot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <style>
body {
  font-family: 'Segoe UI', Arial;
  background: #f4f6f9;
  margin: 0;
  padding: 0;
}

#login, #app {
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #2c3e50;
}

/* DASHBOARD CARDS */
#summary {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
}

#summary div {
  flex: 1;
  padding: 20px;
  border-radius: 12px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

#overdue { background: #e74c3c; }
#soon { background: #f39c12; }
#ok { background: #27ae60; }

/* CARD */
.card {
  background: #ffffff;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

/* MACHINE CARD */
.machine {
  border-left: 5px solid #3498db;
}

/* STATUS */
.status {
  font-weight: bold;
}

.status.ok { color: #27ae60; }
.status.soon { color: #f39c12; }
.status.overdue { color: #e74c3c; }

/* INPUTS */
input {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  background: #2c3e50;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #34495e;
}

/* DROPDOWN */
.dropdown {
  margin-bottom: 10px;
}

.dropdown button {
  background: #3498db;
  font-size: 16px;
  padding: 12px;
}

.dropdown button:hover {
  background: #2980b9;
}

.content {
  display: none;
  padding: 10px;
  max-height: 400px;
  overflow-y: auto;
}

/* ISSUE LOG */
.issue {
  background: #f8f9fa;
  padding: 8px;
  margin-top: 6px;
  border-left: 4px solid #3498db;
  border-radius: 6px;
  font-size: 14px;
}

/* LOGIN */
#login {
  max-width: 400px;
  margin: auto;
}

#login input {
  margin-bottom: 10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>Tech Login</h1>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">
  <h1>DIRECT MAIL DEPOT – Equipment Dashboard</h1>

  <div id="summary">
    <div id="overdue">Overdue: 0</div>
    <div id="soon">Due Soon: 0</div>
    <div id="ok">OK: 0</div>
  </div>

  <div class="card">
    <h3>Add Machine</h3>
    <input id="newName" placeholder="Machine Name">
    <input id="newSerial" placeholder="Serial Number">
    <button onclick="addMachine()">Add Machine</button>
  </div>

  <div id="list"></div>
</div>

<script>

// LOGIN USERS
const users = { tech1: "password1" };

// LOAD DATA
let saved = localStorage.getItem("data");
let data = saved ? JSON.parse(saved) : null;

// FIRST TIME LOAD (ALL EQUIPMENT)
if(!data){
  data = {};
  let id = 1;

  function add(name,type,count){
    for(let i=1;i<=count;i++){
      let sn = type.substring(0,2).toUpperCase() + String(id).padStart(4,"0");
      data[sn] = { name: name + " " + i, serial: sn, type: type, next: "", issues: [] };
      id++;
    }
  }

  // FULL LIST
  add("SCREEN Truepress Jet520HD","Digital Color",1);

  add("Océ VarioStream 7450","Laser",4);
  add("Roll Cart","Laser",1);

  add("MCS Hawk","Inkjet",1);
  add("Videojet 4320","Inkjet",4);

  add("MSE Roll-fed 9-Station Inserter","Inserting",2);
  add("MSE Sheet-fed 6-Station Inserter","Inserting",2);
  add("Flowmaster RS 6-Station","Inserting",3);
  add("Flowmaster RS Special","Inserting",1);
  add("BlueCrest Rival","Inserting",1);
  add("Bowe Fusion 22K","Inserting",1);
  add("Bell and Howell Inserter","Inserting",2);
  add("Universal Friction Feeder","Inserting",20);
  add("Pitney Bowes R750","Inserting",1);

  add("Baum Folder 8-Page","Bindery",6);
  add("Baum Folder 16-Page","Bindery",3);
  add("Baum Folder","Bindery",5);
  add("Baum Slit Score Perf","Bindery",2);
  add("Baum Gate Fold","Bindery",2);
  add("Baum Continuous Feed","Bindery",1);
  add("Form Cutter","Bindery",5);
  add("Form Cutter Signoff","Bindery",1);
  add("Spedo Cutter","Bindery",2);
  add("ESP 400","Bindery",8);
  add("MBO Folder","Bindery",1);
  add("MBO Accumulator","Bindery",2);
  add("Speedo Merger","Bindery",4);
  add("MBO High-Speed Line","Bindery",1);

  add("Pick & Place","Affixing",3);
  add("AT-112 Affixer","Affixing",1);
  add("Tabber Labeler","Affixing",7);

  save();
}

// SAVE
function save(){
  localStorage.setItem("data", JSON.stringify(data));
}

// LOGIN
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(users[u] && users[u] === p){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    render();
  } else {
    alert("Wrong login");
  }
}

// RENDER
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  let types = [...new Set(Object.values(data).map(x => x.type))];

  let overdue=0, soon=0, ok=0;

  types.forEach(type=>{
    let wrap = document.createElement("div");
    wrap.className="dropdown";

    let btn = document.createElement("button");
    btn.innerText = type;

    let content = document.createElement("div");
    content.className="content";

    btn.onclick = () => {
      content.style.display = content.style.display === "block" ? "none" : "block";
    };

    Object.values(data).filter(x=>x.type===type).forEach(e=>{
      let d = e.next ? (new Date(e.next)-new Date())/86400000 : 999;

      let st="OK", cl="ok";
      if(d<0){ st="OVERDUE"; cl="overdue"; overdue++; }
      else if(d<5){ st="SOON"; cl="soon"; soon++; }
      else{ ok++; }

      let div = document.createElement("div");
      div.className="card machine";

      let issues = e.issues.map(i=>`<div>${i}</div>`).join("");

      div.innerHTML = `
        <b>${e.name}</b> (${e.serial})<br>
        <span class="status ${cl}">${st}</span><br>
        <input type="date" onchange="setDate('${e.serial}', this.value)">
        <button onclick="log('${e.serial}')">Log Issue / Parts</button>
        ${issues}
      `;

      content.appendChild(div);
    });

    wrap.appendChild(btn);
    wrap.appendChild(content);
    list.appendChild(wrap);
  });

  document.getElementById("overdue").innerText = "Overdue: " + overdue;
  document.getElementById("soon").innerText = "Due Soon: " + soon;
  document.getElementById("ok").innerText = "OK: " + ok;
}

// SET DATE
function setDate(sn,val){
  data[sn].next = val;
  save();
  render();
}

// LOG ISSUE
function log(sn){
  let t = prompt("Enter issue / parts replaced / ordered:");
  if(!t) return;

  data[sn].issues.push(new Date().toLocaleString() + " - " + t);
  save();
  render();
}

// ADD MACHINE
function addMachine(){
  let name = document.getElementById("newName").value;
  let serial = document.getElementById("newSerial").value;

  if(!name || !serial){
    alert("Enter all fields");
    return;
  }

  if(data[serial]){
    alert("Serial exists");
    return;
  }

  data[serial] = {
    name: name,
    serial: serial,
    type: "Custom",
    next: "",
    issues: []
  };

  save();
  render();
}

// START
document.getElementById("login").style.display = "block";

</script>

</body>
</html>
