<!DOCTYPE html>
<html>
<head>
<title>DMD Equipment System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background:linear-gradient(135deg,#2c3e50,#4ca1af);
}

/* LOGIN */
#login {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box {
  background:#fff;
  padding:40px;
  border-radius:16px;
  width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.login-box img { width:240px; margin-bottom:10px; }
.login-box input {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.login-box button {
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#3498db,#2980b9);
  color:#fff;
  font-weight:bold;
}

/* APP */
#app {
  max-width:1200px;
  margin:20px auto;
  background:#fff;
  border-radius:12px;
  padding:20px;
  display:none;
}

.card {
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
}

button {
  width:100%;
  padding:8px;
  margin-top:5px;
  border:none;
  border-radius:6px;
  background:#2c3e50;
  color:#fff;
}

input {
  width:100%;
  padding:8px;
  margin-top:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <img src="logo.png">
    <h2>Direct Mail Depot</h2>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">

<h2>Equipment Dashboard</h2>

<input id="search" placeholder="Search..." onkeyup="render()">

<div class="card">
  <h3>Add Machine</h3>
  <input id="name" placeholder="Machine Name">
  <input id="serial" placeholder="Serial Number">
  <button onclick="addMachine()">Add</button>
</div>

<button onclick="exportCSV()">Export Excel</button>

<div id="list"></div>

</div>

<script>

// USERS
const users = {
  "Cliff": "DMD2026*"
};

let currentUser = "";

// DATA
let data = JSON.parse(localStorage.getItem("data") || "{}");

// LOGIN (FIXED + SIMPLE)
function login(){
  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();

  if(users[u] && users[u] === p){
    currentUser = u;

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";

    render(); // <-- THIS is key
  } else {
    alert("Wrong username or password");
  }
}

// SAVE
function save(){
  localStorage.setItem("data", JSON.stringify(data));
}

// ADD MACHINE
function addMachine(){
  let name = document.getElementById("name").value;
  let serial = document.getElementById("serial").value;

  if(!name || !serial){
    alert("Enter all fields");
    return;
  }

  data[serial] = {
    name: name,
    serial: serial,
    issues: []
  };

  save();
  render();
}

// LOG ISSUE
function log(sn){
  let t = prompt("Enter issue:");
  if(!t) return;

  data[sn].issues.push(
    new Date().toLocaleString() + " - " + t + " (" + currentUser + ")"
  );

  save();
  render();
}

// RENDER
function render(){
  let search = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");
  list.innerHTML = "";

  Object.values(data).forEach(e => {

    if(search && !e.name.toLowerCase().includes(search)) return;

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${e.name}</b> (${e.serial})<br>
      <button onclick="log('${e.serial}')">Log Issue</button>
      ${(e.issues || []).join("<br>")}
    `;

    list.appendChild(div);
  });
}

// EXPORT CSV
function exportCSV(){
  let rows = [["Name","Serial","Issues"]];

  Object.values(data).forEach(e=>{
    rows.push([e.name, e.serial, (e.issues||[]).join(" | ")]);
  });

  let csv = rows.map(r=>r.join(",")).join("\n");
  let blob = new Blob([csv]);

  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "report.csv";
  a.click();
}

if(readOnly){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  render();
}  
</script>

</body>
</html>
