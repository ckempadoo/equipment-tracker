<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<head>
  <title>Equipment Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <style>
body {
  font-family: 'Segoe UI', Arial;
  background: #eef1f5;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.machine-title {
  font-size: 18px;
  font-weight: bold;
}

.status {
  font-weight: bold;
}

.overdue { color: #e74c3c; }
.soon { color: #f39c12; }
.ok { color: #27ae60; }

button {
  margin-top: 6px;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: #2c3e50;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #34495e;
}

input {
  padding: 6px;
  margin-top: 5px;
  width: 100%;
}

.issue {
  background: #f8f9fa;
  padding: 8px;
  margin-top: 5px;
  border-left: 4px solid #3498db;
  border-radius: 5px;
}
</style>
    .status {
      font-weight: bold;
    }
    .overdue { color: red; }
    .soon { color: orange; }
    .ok { color: green; }
    input {
      padding: 5px;
      margin-top: 5px;
      width: 100%;
    }
    button {
      margin-top: 5px;
      padding: 8px;
      width: 100%;
    }
  </style>
</head>

<body>

<h1>Equipment Dashboard</h1>

<div id="summary"></div>
<div id="machines"></div>

<script>

// LOAD OR DEFAULT DATA
let saved = localStorage.getItem("equipmentData");

let data = saved ? JSON.parse(saved) : {
  "HP Indigo 7K": { nextServiceDue: "2026-04-15" },
  "HP Indigo 18K": { nextServiceDue: "2026-04-10" },
  "HP Indigo 120K": { nextServiceDue: "2026-04-20" }
};

// SAVE FUNCTION
function saveData(){
  localStorage.setItem("equipmentData", JSON.stringify(data));
}

// DASHBOARD SUMMARY
function dashboard(){
  let overdue=0, soon=0, ok=0;

  Object.values(data).forEach(e=>{
    if(!e.nextServiceDue){ ok++; return; }

    let d=(new Date(e.nextServiceDue)-new Date())/(1000*60*60*24);

    if(d<0) overdue++;
    else if(d<5) soon++;
    else ok++;
  });

  document.getElementById("summary").innerHTML = `
    <div class="card">
      <p class="status overdue">Overdue: ${overdue}</p>
      <p class="status soon">Due Soon: ${soon}</p>
      <p class="status ok">OK: ${ok}</p>
    </div>
  `;
}

// RENDER MACHINES
function renderMachines(){
  let container = document.getElementById("machines");
  container.innerHTML = "";

  Object.keys(data).forEach(name=>{
    let e = data[name];

    let d = (new Date(e.nextServiceDue)-new Date())/(1000*60*60*24);

    let statusText = "OK";
    let statusClass = "ok";

    if(d < 0){ statusText = "OVERDUE"; statusClass = "overdue"; }
    else if(d < 5){ statusText = "DUE SOON"; statusClass = "soon"; }

    let issuesHTML = "";
    if(e.issues){
      e.issues.forEach(i=>{
        issuesHTML += `<div class="issue">${i.date}<br>${i.text}</div>`;
      });
    }

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="machine-title">${name}</div>
      <div class="status ${statusClass}">Status: ${statusText}</div>
      <div>Next Service: ${e.nextServiceDue || "Not Set"}</div>

      <input type="date" onchange="updateDate('${name}', this.value)">
      <button onclick="logIssue('${name}')">Log Issue</button>
      <button onclick="markResolved('${name}')">Clear Issues</button>

      ${issuesHTML}
    `;

    container.appendChild(div);
  });
}

// UPDATE DATE
function updateDate(name, date){
  data[name].nextServiceDue = date;
  saveData();
  renderMachines();
  dashboard();
}

// LOG ISSUE
function logIssue(name){
  let issue = prompt("Enter issue for " + name);
  if(!issue) return;

  if(!data[name].issues) data[name].issues = [];
  data[name].issues.push({
    text: issue,
    date: new Date().toLocaleString()
  });

  saveData();
  alert("Issue logged!");
}

function markResolved(name){
  if(!data[name].issues) return;

  if(confirm("Clear all issues for " + name + "?")){
    data[name].issues = [];
    localStorage.setItem("equipmentData", JSON.stringify(data));
    renderMachines();
    dashboard();
  }
}  
// INIT
renderMachines();
dashboard();

</script>

</body>
</html>
