<!DOCTYPE html>
<html>
<head>
  <title>Equipment Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
      padding: 10px;
    }
    h1 {
      text-align: center;
    }
    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status {
      font-weight: bold;
    }
    .overdue { color: red; }
    .soon { color: orange; }
    .ok { color: green; }
    input {
      padding: 5px;
      margin-top: 5px;
      width: 100%;
    }
    button {
      margin-top: 5px;
      padding: 8px;
      width: 100%;
    }
  </style>
</head>

<body>

<h1>Equipment Dashboard</h1>

<div id="summary"></div>
<div id="machines"></div>

<script>

// LOAD OR DEFAULT DATA
let saved = localStorage.getItem("equipmentData");

let data = saved ? JSON.parse(saved) : {
  "HP Indigo 7K": { nextServiceDue: "2026-04-15" },
  "HP Indigo 18K": { nextServiceDue: "2026-04-10" },
  "HP Indigo 120K": { nextServiceDue: "2026-04-20" }
};

// SAVE FUNCTION
function saveData(){
  localStorage.setItem("equipmentData", JSON.stringify(data));
}

// DASHBOARD SUMMARY
function dashboard(){
  let overdue=0, soon=0, ok=0;

  Object.values(data).forEach(e=>{
    if(!e.nextServiceDue){ ok++; return; }

    let d=(new Date(e.nextServiceDue)-new Date())/(1000*60*60*24);

    if(d<0) overdue++;
    else if(d<5) soon++;
    else ok++;
  });

  document.getElementById("summary").innerHTML = `
    <div class="card">
      <p class="status overdue">Overdue: ${overdue}</p>
      <p class="status soon">Due Soon: ${soon}</p>
      <p class="status ok">OK: ${ok}</p>
    </div>
  `;
}

// RENDER MACHINES
function renderMachines(){
  let container = document.getElementById("machines");
  container.innerHTML = "";

  Object.keys(data).forEach(name=>{
    let e = data[name];

    let d = (new Date(e.nextServiceDue)-new Date())/(1000*60*60*24);

    let statusClass = "ok";
    if(d < 0) statusClass = "overdue";
    else if(d < 5) statusClass = "soon";

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${name}</h3>
      <p class="status ${statusClass}">
        Next Service: ${e.nextServiceDue || "Not Set"}
      </p>

      <input type="date" onchange="updateDate('${name}', this.value)">
      <button onclick="logIssue('${name}')">Log Issue</button>
    `;

    container.appendChild(div);
  });
}

// UPDATE DATE
function updateDate(name, date){
  data[name].nextServiceDue = date;
  saveData();
  renderMachines();
  dashboard();
}

// LOG ISSUE
function logIssue(name){
  let issue = prompt("Enter issue for " + name);
  if(!issue) return;

  if(!data[name].issues) data[name].issues = [];
  data[name].issues.push({
    text: issue,
    date: new Date().toLocaleString()
  });

  saveData();
  alert("Issue logged!");
}

// INIT
renderMachines();
dashboard();

</script>

</body>
</html>
