<!DOCTYPE html>
<html>
<head>
<title>DMD Equipment Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(135deg,#2c3e50,#4ca1af);
}

/* LOGIN */
#login {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box {
  background:#fff;
  padding:40px;
  border-radius:16px;
  width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.login-box img { width:240px; margin-bottom:15px; }
.login-box h1 { margin-bottom:5px; }
.login-box p { color:#777; margin-bottom:20px; }

.login-box input {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.login-box button {
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#3498db,#2980b9);
  color:#fff;
  font-weight:bold;
}

/* APP */
.container {
  max-width:1200px;
  margin:30px auto;
  background:#fff;
  border-radius:14px;
  padding:25px;
}

#summary { display:flex; gap:15px; margin-bottom:20px;}
#summary div {
  flex:1;
  padding:20px;
  border-radius:12px;
  color:#fff;
  text-align:center;
  font-weight:bold;
}
#overdue{background:#e74c3c;}
#soon{background:#f39c12;}
#ok{background:#27ae60;}

.card {
  background:#fff;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #eee;
}

.machine { border-left:5px solid #3498db; }

button {
  width:100%;
  padding:10px;
  margin-top:6px;
  border:none;
  border-radius:8px;
  background:#2c3e50;
  color:#fff;
  font-weight:bold;
}

input,select {
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

.dropdown button { background:#3498db; }
.content { display:none; max-height:350px; overflow:auto; }

.issue {
  background:#f8f9fa;
  padding:6px;
  margin-top:5px;
  border-left:4px solid #3498db;
}

.search { margin-bottom:15px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<div style="font-size:30px;">🔒</div>
<img src="logo.png">
<h1>Welcome</h1>
<p>Direct Mail Depot Systems</p>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Sign In</button>
</div>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

<h1>DMD Equipment Dashboard</h1>

<input class="search" id="search" placeholder="Search machines..." onkeyup="render()">

<div id="summary">
<div id="overdue">0</div>
<div id="soon">0</div>
<div id="ok">0</div>
</div>

<div class="card" id="addBox">
<h3>Add / Select Machine</h3>
<select id="machineSelect"></select>
<input id="newName" placeholder="New Machine Name">
<input id="newSerial" placeholder="Serial Number">
<button onclick="addMachine()">Add / Use Machine</button>
</div>

<button onclick="printReport()">Print Report</button>
<button onclick="sendText()">Text Maintenance</button>

<div id="list"></div>

</div>

<script>

let readOnly = window.location.search.includes("view=true");
const users = { Cliff:"DMD2026*" };

let saved = localStorage.getItem("data");
let data = saved ? JSON.parse(saved) : null;

if(!data){
data={}; let id=1;
function add(n,t,c){
for(let i=1;i<=c;i++){
let sn=t.substring(0,2).toUpperCase()+id++;
data[sn]={name:n+" "+i,serial:sn,type:t,next:"",issues:[]};
}}
add("Printer","Digital",5);
add("Inserter","Inserting",10);
add("Binder","Bindery",10);
save();
}

function save(){localStorage.setItem("data",JSON.stringify(data));}

function login(){
  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();

  if(users[u] && users[u] === p){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    render();
  } else {
    alert("Invalid username or password");
  }
}

function populate(){
let s=machineSelect;
s.innerHTML='<option value="">Select Machine</option>';
Object.values(data).forEach(e=>{
let o=document.createElement("option");
o.value=e.serial;
o.text=e.name;
s.appendChild(o);
});
}

function render(){
populate();

let search=document.getElementById("search").value.toLowerCase();
let list=document.getElementById("list");
list.innerHTML="";

let o=0,s=0,k=0;

Object.values(data).forEach(e=>{
if(search && !e.name.toLowerCase().includes(search)) return;

let d=e.next?(new Date(e.next)-new Date())/86400000:999;
let st="OK";
if(d<0){st="OVERDUE";o++}
else if(d<5){st="SOON";s++}
else{k++}

let div=document.createElement("div");
div.className="card machine";

div.innerHTML=`
<b>${e.name}</b> (${e.serial})<br>
${st}<br>
${readOnly?"":`<input type="date" onchange="setDate('${e.serial}',this.value)">`}
${readOnly?"":`<button onclick="log('${e.serial}')">Log</button>`}
${(e.issues||[]).join("<br>")}
`;

list.appendChild(div);
});

overdue.innerText=o;
soon.innerText=s;
ok.innerText=k;

if(readOnly) addBox.style.display="none";
}

function setDate(sn,v){data[sn].next=v;save();render();}

function log(sn){
let t=prompt("Issue:");
if(!t)return;
data[sn].issues.push(new Date().toLocaleString()+" - "+t+" (Cliff)");
save();render();
}

function addMachine(){
if(machineSelect.value)return alert("Selected existing");

data[newSerial.value]={name:newName.value,serial:newSerial.value,type:"Custom",issues:[]};
save();render();
}

function sendText(){
window.location.href="sms:17325551234?body=Machine needs attention";
}

function printReport(){
let w=window.open("");
let html="<h1>Report</h1>";
Object.values(data).forEach(e=>{
html+=`<h3>${e.name}</h3><hr>`;
});
w.document.write(html);
w.print();
}

if(readOnly){login.style.display="none";app.style.display="block";render();}
else login.style.display="flex";

</script>

</body>
</html>
