<html>
<head>
<title>DMD Equipment System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {margin:0;font-family:'Segoe UI';background:linear-gradient(135deg,#2c3e50,#4ca1af);}
#login {height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box {background:#fff;padding:40px;border-radius:16px;width:360px;text-align:center;}

.container {max-width:1200px;margin:20px auto;background:#fff;border-radius:14px;padding:20px;}

#summary {display:flex;gap:10px;margin-bottom:15px;}
#summary div {flex:1;padding:15px;border-radius:10px;color:#fff;text-align:center;font-weight:bold;}
#overdue{background:#e74c3c;} #soon{background:#f39c12;} #ok{background:#27ae60;}
#summary {
  position: relative;
  z-index: 10;
}

button {
  position: relative;
  z-index: 10;
}
#summary {
  position: relative;
  z-index: 10;
}

button {
  position: relative;
  z-index: 10;
}

.content {
  display: none;
  padding: 10px;
  position: relative;
  z-index: 1;
}  
.card {border:1px solid #ddd;border-radius:10px;padding:10px;margin-bottom:10px;}
.machine {border-left:5px solid #3498db;}

button {width:100%;padding:8px;margin-top:5px;border:none;border-radius:6px;background:#2c3e50;color:#fff;}
input,select,textarea {width:100%;padding:8px;margin-top:5px;box-sizing:border-box;}

.status.ok{color:green;font-weight:bold;}
.status.soon{color:orange;font-weight:bold;}
.status.overdue{color:red;font-weight:bold;}

.content{display:none;padding:10px;}
</style>
</head>

<body>

<div id="login">
<div class="login-box">
<h2>Direct Mail Depot</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<div id="app" class="container" style="display:none;">

<h2>DMD Equipment Dashboard</h2>

<div id="summary">
<div id="overdue" onclick="setFilter('OVERDUE')">Overdue: 0</div>
<div id="soon" onclick="setFilter('SOON')">Due Soon: 0</div>
<div id="ok" onclick="setFilter('OK')">OK: 0</div>
</div>
<button onclick="setFilter('ALL')">Show All</button>
<div class="card">
<h3>Add Machine</h3>

<select id="category">
<option>Screen Inkjet HD520 Digital Press</option>
<option>HP Indigo Digital Press</option>
<option>Laser</option>
<option>Inkjet</option>
<option>Inserting</option>
<option>Bindery</option>
<option>Affixing</option>
</select>

<input id="name" placeholder="Machine Name">
<input id="serial" placeholder="Serial Number">
<input id="date" type="date">

<button onclick="addMachine()">Add Machine</button>
</div>

<input id="search" placeholder="Search..." onkeyup="render()">

<button onclick="exportCSV()">Export Excel</button>
<button onclick="sendText()">Send Text</button>

<div id="list"></div>

</div>

<script type="module">

// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhkaJGgEvon9hC5y5LMXRMf01iaIL0mkU",
  authDomain: "dmd-equipment-tracker.firebaseapp.com",
  projectId: "dmd-equipment-tracker",
  storageBucket: "dmd-equipment-tracker.firebasestorage.app",
  messagingSenderId: "649433121134",
  appId: "1:649433121134:web:99a0d2b15582627753417f",
  measurementId: "G-Z8XBMNXYJL"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let data = {};
let currentFilter = "ALL";
// LOGIN
function login(){

try {

let u = document.getElementById("user").value.trim();
let p = document.getElementById("pass").value.trim();

if(u === "Cliff" && p === "DMD2026*"){

loadData();

document.getElementById("login").style.display = "none";
document.getElementById("app").style.display = "block";

render();

}else{
alert("Wrong login");
}

} catch(e){
alert("Login error: " + e.message);
console.log(e);
}

}

// LOAD/SAVE
function saveData(){
localStorage.setItem("dmd_machines", JSON.stringify(data));
}

function loadData(){
let saved=localStorage.getItem("dmd_machines");
if(saved){
data=JSON.parse(saved);
}else{
// DEFAULT DATA (only first time)
data={
"INS001":{name:"MSE Inserter 1",serial:"INS001",type:"Inserting",issues:[],next:""},
"BD001":{name:"Baum Folder",serial:"BD001",type:"Bindery",issues:[],next:""},
"AF001":{name:"Affixer System",serial:"AF001",type:"Affixing",issues:[],next:""}
};
}
}

// ADD
function addMachine(){
let name=document.getElementById("name").value.trim();
let serial=document.getElementById("serial").value.trim();
let type=document.getElementById("category").value;
let date=document.getElementById("date").value;

if(!name||!serial){
alert("Enter Name + Serial");
return;
}

if(data[serial]){
alert("Serial exists");
return;
}

data[serial]={name,serial,type,issues:[],next:date};

saveData();
render();
}

// DELETE
function deleteMachine(sn){
if(confirm("Delete?")){
delete data[sn];
saveData();
render();
}
}

function editMachine(sn){

let e = data[sn];

let panel = document.createElement("div");
panel.style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;border-radius:10px;width:320px;z-index:9999;box-shadow:0 0 15px rgba(0,0,0,0.3);";

panel.innerHTML = `
<h3>Edit Machine</h3>

<input id="e_name" value="${e.name}">
<input id="e_serial" value="${e.serial}">

<select id="e_type">
<option ${e.type==="Screen Inkjet HD520 Digital Press"?"selected":""}>Screen Inkjet HD520 Digital Press</option>
<option ${e.type==="HP Indigo Digital Press"?"selected":""}>HP Indigo Digital Press</option>
<option ${e.type==="Laser"?"selected":""}>Laser</option>
<option ${e.type==="Inkjet"?"selected":""}>Inkjet</option>
<option ${e.type==="Inserting"?"selected":""}>Inserting</option>
<option ${e.type==="Bindery"?"selected":""}>Bindery</option>
<option ${e.type==="Affixing"?"selected":""}>Affixing</option>
</select>

<input id="e_date" type="date" value="${e.next||""}">

<h4>Logs</h4>
<textarea id="e_logs">${(e.issues||[]).join("\n")}</textarea>

<input id="new_log" placeholder="Add new log">
<button onclick="addLog('${sn}')">Add Log</button>

<button onclick="saveEdit('${sn}')">Save</button>
<button onclick="this.parentElement.remove()">Close</button>
`;

document.body.appendChild(panel);
}
function saveEdit(old){

let name = document.getElementById("e_name").value.trim();
let serial = document.getElementById("e_serial").value.trim();
let date = document.getElementById("e_date").value;
let logs = document.getElementById("e_logs").value.split("\n");
let type = document.getElementById("e_type").value;

// 🚫 prevent duplicate serial
if(serial !== old && data[serial]){
  alert("Serial already exists");
  return;
}

// 🔥 remove old record
delete data[old];

// 🔥 save updated record
data[serial] = {
  name: name,
  serial: serial,
  type: type,
  issues: logs,
  next: date
};

// ✅ CLOSE POPUP
let popup = document.querySelector("div[style*='z-index']");
if(popup) popup.remove();

// ✅ SAVE + RELOAD
saveData();
render();

}function addLog(sn){

let txt = document.getElementById("new_log").value.trim();
if(!txt) return;

let time = new Date().toLocaleString();

// make sure issues exists
if(!data[sn].issues){
data[sn].issues = [];
}

// add log with timestamp
data[sn].issues.push(time + " - " + txt);

// update textarea live
document.getElementById("e_logs").value = data[sn].issues.join("\n");

// clear input
document.getElementById("new_log").value = "";

saveData();
}
// delete old entry
delete data[oldSn];
  
// RENDER
function render(){

let list = document.getElementById("list");
list.innerHTML = "";

// ✅ ADD COUNTERS
let overdue = 0, soon = 0, ok = 0;
Object.values(data).forEach(e=>{

let d = e.next ? (new Date(e.next) - new Date()) / 86400000 : 999;  
  
let status = "OK";

if(d < 0){
  status = "OVERDUE";
  overdue++;
}
else if(d < 5){
  status = "SOON";
  soon++;
}
else{
  ok++;
}
  
// FILTER (THIS IS WHAT MAKES BUTTONS WORK)
  
if(currentFilter !== "ALL" && status !== currentFilter) return;
});
  
let types = [
"Screen Inkjet HD520 Digital Press",
"HP Indigo Digital Press",
"Laser",
"Inkjet",
"Inserting",
"Bindery",
"Affixing"
];

types.forEach(t=>{

let wrap = document.createElement("div");
let btn = document.createElement("button");
btn.innerText = t;

let content = document.createElement("div");
content.className = "content";

btn.onclick = ()=> content.style.display =
content.style.display === "block" ? "none" : "block";

Object.values(data).forEach(e=>{

let d = e.next ? (new Date(e.next) - new Date()) / 86400000 : 999;

let status = "OK";

// ✅ COUNT + STATUS
if(d < 0){
status = "OVERDUE";
}
else if(d < 5){
status = "SOON";
}

// ✅ FILTER
if(currentFilter !== "ALL" && status !== currentFilter) return;

// ✅ FIX CATEGORY MATCH (IMPORTANT)
if((e.type || "").trim() !== t) return;

let div = document.createElement("div");
div.className = "card machine";

div.innerHTML = `
<b>${e.name}</b><br>
Serial: ${e.serial}<br>
<span class="status ${status.toLowerCase()}">${status}</span><br>

<div style="margin:5px 0;font-size:12px;color:#555;">
${(e.issues||[]).slice(-3).reverse().map(l=>`<div style="padding:3px 0;border-bottom:1px solid #eee;">• ${l}</div>`).join("")}
</div>

<button onclick="editMachine('${e.serial}')">Edit</button>
<button onclick="deleteMachine('${e.serial}')">Delete</button>
`;

content.appendChild(div);

});

wrap.appendChild(btn);
wrap.appendChild(content);
list.appendChild(wrap);

});

// ✅ UPDATE TOP SUMMARY
document.getElementById("overdue").innerText = "Overdue: " + overdue;
document.getElementById("soon").innerText = "Due Soon: " + soon;
document.getElementById("ok").innerText = "OK: " + ok;

}

// EXPORT
function exportCSV(){
let rows=[["Name","Serial","Type"]];
Object.values(data).forEach(e=>{
rows.push([e.name,e.serial,e.type]);
});
let csv=rows.map(r=>r.join(",")).join("\n");
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="machines.csv";
a.click();
}

// SMS
function sendText(){
window.location.href="sms:17325551234?body=Check machines";
}
function setFilter(type){
currentFilter = type;
render();
}

</script>

</body>
</html>
