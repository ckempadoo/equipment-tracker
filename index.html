<!DOCTYPE html>
<html>
<head>
  <title>Equipment Dashboard - Direct Mail Depot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Arial; background: #eef1f5; margin:0; padding:0; }
    #login-container, #dashboard-container { display:none; padding:20px; }
    h1 { text-align:center; margin-bottom:15px; }
    .card { background:#fff; padding:12px; margin-bottom:10px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,0.08); }
    .machine-title { font-weight:bold; }
    .status { font-weight:bold; }
    .overdue { color:#e74c3c; }
    .soon { color:#f39c12; }
    .ok { color:#27ae60; }
    input, select { padding:6px; margin-top:5px; width:100%; box-sizing:border-box; }
    button { margin-top:6px; padding:8px; border:none; border-radius:6px; background:#2c3e50; color:white; cursor:pointer; width:100%; }
    button:hover { background:#34495e; }
    .issue { background:#f8f9fa; padding:8px; margin-top:5px; border-left:4px solid #3498db; border-radius:5px; }
    #summary { display:flex; justify-content: space-around; margin-bottom:15px; }
    #summary .card { color:white; flex:1; text-align:center; margin:0 5px; padding:10px; border-radius:10px; }
    #overdue-card { background:#e74c3c; }
    #soon-card { background:#f39c12; }
    #ok-card { background:#27ae60; }
    .category { margin-bottom:10px; }
    .dropdown-content { display:none; padding:0 10px; max-height:300px; overflow-y:auto; }
    .category button { background:#3498db; color:white; margin-bottom:5px; width:100%; }
    .category button:hover { background:#2980b9; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-container">
  <h1>Tech Login</h1>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p style="color:red;" id="login-error"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard-container">
  <h1>DIRECT MAIL DEPOT – Equipment Dashboard</h1>

  <div id="summary">
    <div id="overdue-card" class="card">Overdue: 0</div>
    <div id="soon-card" class="card">Due Soon: 0</div>
    <div id="ok-card" class="card">OK: 0</div>
  </div>

  <div class="card">
    <h3>Add Machine</h3>
    <input type="text" id="newMachineName" placeholder="Machine Name">
    <input type="text" id="newMachineSerial" placeholder="Serial Number">
    <button onclick="addMachine()">Add Machine</button>
  </div>

  <div id="equipment-dropdowns"></div>
</div>

<script>
// ----- LOGIN -----
const users = { tech1: "password1", tech2: "password2" }; // simple username:password
function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  if(users[u] && users[u] === p){
    document.getElementById("login-container").style.display="none";
    document.getElementById("dashboard-container").style.display="block";
    renderEquipmentDropdowns();
    dashboard();
  } else { document.getElementById("login-error").innerText="Invalid username or password"; }
}

// ----- DATA -----
let saved = localStorage.getItem("equipmentData");
let data = saved ? JSON.parse(saved) : {
  // Digital Color
  "DC001": { name: "SCREEN Truepress Jet520HD", serial:"DC001", type:"Digital Color", nextServiceDue:"", issues:[] },
  // Laser
  "L001": { name:"Océ VarioStream 7450", serial:"L001", type:"Laser", nextServiceDue:"", issues:[] },
  "L002": { name:"Océ VarioStream 7450", serial:"L002", type:"Laser", nextServiceDue:"", issues:[] },
  "L003": { name:"Océ VarioStream 7450", serial:"L003", type:"Laser", nextServiceDue:"", issues:[] },
  "L004": { name:"Océ VarioStream 7450", serial:"L004", type:"Laser", nextServiceDue:"", issues:[] },
  "L005": { name:"Roll cart", serial:"L005", type:"Laser", nextServiceDue:"", issues:[] },
  // Inkjet
  "IJ001": { name:"MCS Hawk", serial:"IJ001", type:"Inkjet", nextServiceDue:"", issues:[] },
  "IJ002": { name:"Videojet 4320", serial:"IJ002", type:"Inkjet", nextServiceDue:"", issues:[] },
  "IJ003": { name:"Videojet 4320", serial:"IJ003", type:"Inkjet", nextServiceDue:"", issues:[] },
  "IJ004": { name:"Videojet 4320", serial:"IJ004", type:"Inkjet", nextServiceDue:"", issues:[] },
  "IJ005": { name:"Videojet 4320", serial:"IJ005", type:"Inkjet", nextServiceDue:"", issues:[] }
  // Add the rest similarly...
};

// ----- SAVE -----
function saveData(){ localStorage.setItem("equipmentData", JSON.stringify(data)); }

// ----- DASHBOARD -----
function dashboard(){
  let overdue=0, soon=0, ok=0;
  Object.values(data).forEach(e=>{
    if(!e.nextServiceDue){ ok++; return; }
    let d=(new Date(e.nextServiceDue)-new Date())/(1000*60*60*24);
    if(d<0) overdue++; else if(d<5) soon++; else ok++;
  });
  document.getElementById("overdue-card").innerText="Overdue: "+overdue;
  document.getElementById("soon-card").innerText="Due Soon: "+soon;
  document.getElementById("ok-card").innerText="OK: "+ok;
}

// ----- RENDER DROPDOWNS -----
function renderEquipmentDropdowns(){
  const container = document.getElementById("equipment-dropdowns");
  container.innerHTML="";
  const types = [...new Set(Object.values(data).map(e=>e.type))];
  types.forEach(type=>{
    const div = document.createElement("div");
    div.className="category";
    const btn = document.createElement("button");
    btn.innerText=type;
    btn.onclick=()=> { content.style.display = content.style.display==="block"?"none":"block"; };
    const content = document.createElement("div");
    content.className="dropdown-content";
    Object.values(data).filter(e=>e.type===type).forEach(e=>{
      const mDiv=document.createElement("div");
      mDiv.className="card";
      const d = e.nextServiceDue ? (new Date(e.nextServiceDue)-new Date())/(1000*60*60*24) : 999;
      let statusText="OK", statusClass="ok";
      if(d<0){ statusText="OVERDUE"; statusClass="overdue"; }
      else if(d<5){ statusText="DUE SOON"; statusClass="soon"; }
      let issuesHTML="";
      if(e.issues) e.issues.forEach(i=>{ issuesHTML += `<div class="issue">${i.date}<br>${i.text}</div>`; });
      mDiv.innerHTML=`
        <div class="machine-title">${e.name} (SN: ${e.serial})</div>
        <div class="status ${statusClass}">Status: ${statusText}</div>
        <div>Next Service: ${e.nextServiceDue || "Not Set"}</div>
        <input type="date" onchange="updateDate('${e.serial}', this.value)">
        <button onclick="logIssue('${e.serial}')">Log Issue / Part</button>
        <button onclick="markResolved('${e.serial}')">Clear Issues</button>
        ${issuesHTML}
      `;
      content.appendChild(mDiv);
    });
    div.appendChild(btn);
    div.appendChild(content);
    container.appendChild(div);
  });
}

// ----- FUNCTIONS -----
function addMachine(){
  const name=document.getElementById("newMachineName").value.trim();
  const serial=document.getElementById("newMachineSerial").value.trim();
  if(!name||!serial){ alert("Please enter both name & serial"); return; }
  if(data[serial]){ alert("Serial number exists"); return; }
  data[serial]={name,serial,type:"Custom",nextServiceDue:"",issues:[]};
  saveData(); renderEquipmentDropdowns(); dashboard();
  document.getElementById("newMachineName").value=""; document.getElementById("newMachineSerial").value="";
}

function updateDate(serial,date){ data[serial].nextServiceDue=date; saveData(); renderEquipmentDropdowns(); dashboard(); }

function logIssue(serial){
  const issue=prompt("Enter issue, parts replaced, or orders for "+data[serial].name);
  if(!issue) return;
  if(!data[serial].issues) data[serial].issues=[];
  data[serial].issues.push({text:issue,date:new Date().toLocaleString()});
  saveData(); renderEquipmentDropdowns(); dashboard();
}

function markResolved(serial){
  if(!data[serial].issues || data[serial].issues.length===0) return;
  if(confirm("Clear all issues for "+data[serial].name+"?")){ data[serial].issues=[]; saveData(); renderEquipmentDropdowns(); dashboard(); }
}

// Show login first
document.getElementById("login-container").style.display="block";
</script>

</body>
</html>
