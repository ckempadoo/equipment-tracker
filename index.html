<!DOCTYPE html>
<html>
<head>
<title>DMD Equipment System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {margin:0;font-family:'Segoe UI';background:linear-gradient(135deg,#2c3e50,#4ca1af);}
#login {height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box {background:#fff;padding:40px;border-radius:16px;width:360px;text-align:center;}

.container {max-width:1200px;margin:20px auto;background:#fff;border-radius:14px;padding:20px;}

#summary {display:flex;gap:10px;margin-bottom:15px;}
#summary div {flex:1;padding:15px;border-radius:10px;color:#fff;text-align:center;font-weight:bold;}
#overdue{background:#e74c3c;} #soon{background:#f39c12;} #ok{background:#27ae60;}

.card {border:1px solid #ddd;border-radius:10px;padding:10px;margin-bottom:10px;}
.machine {border-left:5px solid #3498db;}

button {width:100%;padding:8px;margin-top:5px;border:none;border-radius:6px;background:#2c3e50;color:#fff;}
input,select {width:100%;padding:8px;margin-top:5px;box-sizing:border-box;}

.status.ok{color:green;font-weight:bold;}
.status.soon{color:orange;font-weight:bold;}
.status.overdue{color:red;font-weight:bold;}

.content{display:none;padding:10px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h2>Direct Mail Depot</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
</div>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

<h2>DMD Equipment Dashboard</h2>

<div id="summary">
<div id="overdue">Overdue: 0</div>
<div id="soon">Due Soon: 0</div>
<div id="ok">OK: 0</div>
</div>

<div class="card">
<h3>Add Machine</h3>

<select id="category">
<option>Screen Inkjet HD520 Digital Press</option>
<option>HP Indigo Digital Press</option>
<option>Laser</option>
<option>Inkjet</option>
<option>Inserting</option>
<option>Bindery</option>
<option>Affixing</option>
</select>

<input id="name" placeholder="Machine Name">
<input id="serial" placeholder="Serial Number">
<input id="date" type="date">

<button onclick="addMachine()">Add Machine</button>
</div>

<input id="search" placeholder="Search..." onkeyup="render()">

<button onclick="exportCSV()">Export Excel</button>
<button onclick="sendText()">Send Text</button>

<div id="list"></div>

<div style="text-align:center;margin-top:20px;font-size:12px;color:#777;">
© Clifford Kempadoo
</div>

</div>

<script>

const users={"Cliff":"DMD2026*"};
let currentUser="";

// 🔥 COMPLETE EQUIPMENT MASTER LIST
const machineList = [
"SCREEN Truepress Jet520HD 1",
"SCREEN Truepress Jet520HD 2",
"HP Digital Press",

"Océ VarioStream 7450 #1",
"Océ VarioStream 7450 #2",
"Océ VarioStream 7450 #3",
"Océ VarioStream 7450 #4",

"MCS Hawk",
"Videojet 4320 #1",
"Videojet 4320 #2",
"Videojet 4320 #3",
"Videojet 4320 #4",

"MSE Inserter 1",
"MSE Inserter 2",
"Flowmaster RS Inserter 1",
"Flowmaster RS Inserter 2",
"Flowmaster RS Inserter 3",
"Flowmaster RS Inserter 4",
"BlueCrest Rival",
"Bowe Fusion Inserter",
"Bell and Howell Inserter 1",
"Bell and Howell Inserter 2",

"Baum Folder 1",
"Baum Folder 2",
"Baum Folder 3",
"Baum Folder 4",
"Baum Folder 5",
"Baum Folder 6",
"MBO Folder",
"MBO Accumulator",
"Spedo Cutter",
"ESP 400",

"Affixer System 1",
"Affixer System 2",
"Tabber 1",
"Tabber 2",
"Tabber 3"
];

// 🔥 DATA STORAGE
let data = {

"DI001": {name:"SCREEN Truepress Jet520HD 1",serial:"DI001",type:"Screen Inkjet HD520 Digital Press",issues:[]},
"DI002": {name:"SCREEN Truepress Jet520HD 2",serial:"DI002",type:"Screen Inkjet HD520 Digital Press",issues:[]},

"HP001": {name:"HP Digital Press",serial:"HP001",type:"HP Digital Press",issues:[]},

"LA001": {name:"Océ VarioStream 7450 #1",serial:"LA001",type:"Laser",issues:[]},
"LA002": {name:"Océ VarioStream 7450 #2",serial:"LA002",type:"Laser",issues:[]},
"LA003": {name:"Océ VarioStream 7450 #3",serial:"LA003",type:"Laser",issues:[]},
"LA004": {name:"Océ VarioStream 7450 #4",serial:"LA004",type:"Laser",issues:[]},

"IN001": {name:"MCS Hawk",serial:"IN001",type:"Inkjet",issues:[]},
"IN002": {name:"Videojet 4320 #1",serial:"IN002",type:"Inkjet",issues:[]},
"IN003": {name:"Videojet 4320 #2",serial:"IN003",type:"Inkjet",issues:[]},
"IN004": {name:"Videojet 4320 #3",serial:"IN004",type:"Inkjet",issues:[]},
"IN005": {name:"Videojet 4320 #4",serial:"IN005",type:"Inkjet",issues:[]},

"INS001": {name:"MSE Inserter 1",serial:"INS001",type:"Inserting",issues:[]},
"INS002": {name:"MSE Inserter 2",serial:"INS002",type:"Inserting",issues:[]},
"INS003": {name:"Flowmaster RS Inserter 1",serial:"INS003",type:"Inserting",issues:[]},
"INS004": {name:"Flowmaster RS Inserter 2",serial:"INS004",type:"Inserting",issues:[]},
"INS005": {name:"Flowmaster RS Inserter 3",serial:"INS005",type:"Inserting",issues:[]},
"INS006": {name:"Flowmaster RS Inserter 4",serial:"INS006",type:"Inserting",issues:[]},
"INS007": {name:"BlueCrest Rival",serial:"INS007",type:"Inserting",issues:[]},
"INS008": {name:"Bowe Fusion Inserter",serial:"INS008",type:"Inserting",issues:[]},
"INS009": {name:"Bell and Howell Inserter 1",serial:"INS009",type:"Inserting",issues:[]},
"INS010": {name:"Bell and Howell Inserter 2",serial:"INS010",type:"Inserting",issues:[]},

"BD001": {name:"Baum Folder 1",serial:"BD001",type:"Bindery",issues:[]},
"BD002": {name:"Baum Folder 2",serial:"BD002",type:"Bindery",issues:[]},
"BD003": {name:"Baum Folder 3",serial:"BD003",type:"Bindery",issues:[]},
"BD004": {name:"Baum Folder 4",serial:"BD004",type:"Bindery",issues:[]},
"BD005": {name:"Baum Folder 5",serial:"BD005",type:"Bindery",issues:[]},
"BD006": {name:"Baum Folder 6",serial:"BD006",type:"Bindery",issues:[]},
"BD007": {name:"MBO Folder",serial:"BD007",type:"Bindery",issues:[]},
"BD008": {name:"MBO Accumulator",serial:"BD008",type:"Bindery",issues:[]},
"BD009": {name:"Spedo Cutter",serial:"BD009",type:"Bindery",issues:[]},
"BD010": {name:"ESP 400",serial:"BD010",type:"Bindery",issues:[]},

"AF001": {name:"Affixer System 1",serial:"AF001",type:"Affixing",issues:[]},
"AF002": {name:"Affixer System 2",serial:"AF002",type:"Affixing",issues:[]},
"AF003": {name:"Tabber 1",serial:"AF003",type:"Affixing",issues:[]},
"AF004": {name:"Tabber 2",serial:"AF004",type:"Affixing",issues:[]},
"AF005": {name:"Tabber 3",serial:"AF005",type:"Affixing",issues:[]}

};

// LOGIN
loginBtn.onclick=function(){
let u=user.value.trim(),p=pass.value.trim();
if(users[u]===p){
login.style.display="none";
app.style.display="block";
currentUser=u;
render();
populateDropdown();
}else alert("Wrong login");
};

// 🔽 POPULATE MACHINE DROPDOWN
function populateDropdown(){

let select=document.getElementById("name");
select.innerHTML="";

machineList.forEach(m=>{
let opt=document.createElement("option");
opt.value=m;
opt.textContent=m;
select.appendChild(opt);
});

}

// ➕ ADD MACHINE (FIXED)
function addMachine(){

let name=document.getElementById("name").value.trim();
let serial=document.getElementById("serial").value.trim();
let type=document.getElementById("category").value;

if(name===""||serial===""){
alert("Enter fields");
return;
}

// AUTO ID
let id=serial;

data[id]={
name,
serial,
type,
issues:[],
next:""
};

render();
}

// 🔄 RENDER
function render(){

let search=document.getElementById("search").value.toLowerCase();
list.innerHTML="";

let overdue=0, soon=0, ok=0;

let types=["Screen Inkjet HD520 Digital Press","HP Digital Press","Laser","Inkjet","Inserting","Bindery","Affixing"];

types.forEach(t=>{

let wrap=document.createElement("div");
let btn=document.createElement("button");
btn.innerText=t;

let content=document.createElement("div");
content.className="content";

btn.onclick=()=>content.style.display=content.style.display==="block"?"none":"block";

Object.values(data).filter(e=>e.type===t).forEach(e=>{

if(search && !e.name.toLowerCase().includes(search) && !e.serial.toLowerCase().includes(search)) return;

// 🔥 SERVICE STATUS
let d=e.next?(new Date(e.next)-new Date())/86400000:999;
let status="OK",cl="ok";

if(d<0){status="OVERDUE";cl="overdue";overdue++}
else if(d<5){status="SOON";cl="soon";soon++}
else{ok++}

let imgs=(e.images||[]).map(i=>`<img src="${i}" width="60">`).join("");

let div=document.createElement("div");
div.className="card machine";

div.innerHTML=`
<b>${e.name} (${e.serial})</b><br>
Serial #: ${e.serial}<br>
<span class="status ${cl}">${status}</span><br>

<button onclick="editMachine('${e.serial}')">Edit Full</button>
<button onclick="deleteMachine('${e.serial}')">Delete</button>

<input type="file" onchange="uploadPhoto('${e.serial}',this)">
${imgs}

${e.issues.join("<br>")}
`;

content.appendChild(div);
});

wrap.appendChild(btn);
wrap.appendChild(content);
list.appendChild(wrap);

});

// 🔥 UPDATE DASHBOARD
document.getElementById("overdue").innerText="Overdue: "+overdue;
document.getElementById("soon").innerText="Due Soon: "+soon;
document.getElementById("ok").innerText="OK: "+ok;

}

// 🛠 LOG ISSUE
function logIssue(sn){
let t=prompt("Issue:");
if(!t)return;
data[sn].issues.push(t+" ("+currentUser+")");
render();
}

// ✏️ FULL EDIT
function editMachine(sn){

let e=data[sn];

let form=prompt(
`EDIT MACHINE

Name:
${e.name}

Serial:
${e.serial}

Category:
${e.type}

Service Date (YYYY-MM-DD):
${e.next || ""}

Logs (separate with |):
${e.issues.join("|")}
`);

if(!form) return;

let lines=form.split("\n");

let name=lines[1]?.trim();
let serial=lines[3]?.trim();
let type=lines[5]?.trim();
let date=lines[7]?.trim();
let logs=lines[9]?.trim();

if(!name || !serial || !type) return alert("Invalid input");

// 🔥 SAFE UPDATE
delete data[sn];

data[serial]={
name,
serial,
type,
next:date,
issues:logs ? logs.split("|") : [],
images:e.images || []
};

render();
}

// ❌ DELETE
function deleteMachine(sn){
if(confirm("Delete machine?")){
delete data[sn];
render();
}
}

// 📱 SMS
function sendText(){
window.location.href="sms:17325551234?body=Machine needs attention";
}

</script>
</body>
</html>
