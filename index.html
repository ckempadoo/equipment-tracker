<!DOCTYPE html>
<html>
<head>
<title>DMD Equipment Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family:'Segoe UI'; background:#f4f6f9; margin:0; }
#login,#app { padding:20px; max-width:1200px; margin:auto; display:none;}
h1 { text-align:center; color:#2c3e50; }

#summary { display:flex; gap:15px; margin-bottom:20px;}
#summary div { flex:1; padding:20px; border-radius:12px; color:#fff; text-align:center; font-weight:bold;}
#overdue { background:#e74c3c;}
#soon { background:#f39c12;}
#ok { background:#27ae60;}

.card { background:#fff; padding:15px; margin-bottom:15px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,0.08);}
.machine { border-left:5px solid #3498db;}

button { width:100%; padding:10px; margin-top:8px; border:none; border-radius:8px; background:#2c3e50; color:#fff; font-weight:bold;}
button:hover { background:#34495e;}

input { width:100%; padding:8px; margin-top:8px; border-radius:6px; border:1px solid #ccc;}

.status.ok { color:#27ae60;}
.status.soon { color:#f39c12;}
.status.overdue { color:#e74c3c;}

.dropdown button { background:#3498db;}
.content { display:none; max-height:400px; overflow:auto; padding:10px;}

.issue { background:#f8f9fa; padding:8px; margin-top:6px; border-left:4px solid #3498db;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<img src="logo.png" style="display:block;margin:auto;width:180px;margin-bottom:20px;">
<h1>Tech Login</h1>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">
<h1>DMD Equipment Dashboard</h1>

<div id="summary">
<div id="overdue">Overdue: 0</div>
<div id="soon">Due Soon: 0</div>
<div id="ok">OK: 0</div>
</div>

<div class="card" id="addBox">
<h3>Add Machine</h3>
<input id="newName" placeholder="Machine Name">
<input id="newSerial" placeholder="Serial Number">
<button onclick="addMachine()">Add Machine</button>
</div>

<button onclick="printReport()">Print Report</button>

<div id="list"></div>
</div>

<script>

// MODE
let readOnly = window.location.search.includes("view=true");

// USERS
const users = { tech1:"password1" };

// LOAD
let saved = localStorage.getItem("data");
let data = saved ? JSON.parse(saved) : null;

// INIT DATA
if(!data){
data={}; let id=1;
function add(n,t,c){
for(let i=1;i<=c;i++){
let sn=t.substring(0,2).toUpperCase()+String(id).padStart(4,"0");
data[sn]={name:n+" "+i,serial:sn,type:t,next:"",issues:[]};
id++;
}}
add("SCREEN Truepress Jet520HD","Digital",1);
add("Océ VarioStream 7450","Laser",4);
add("Roll Cart","Laser",1);
add("MCS Hawk","Inkjet",1);
add("Videojet 4320","Inkjet",4);
add("MSE Roll-fed Inserter","Inserting",2);
add("MSE Sheet-fed Inserter","Inserting",2);
add("Flowmaster RS","Inserting",4);
add("BlueCrest Rival","Inserting",1);
add("Bowe Fusion","Inserting",1);
add("Bell and Howell","Inserting",2);
add("Universal Feeder","Inserting",20);
add("Pitney Bowes R750","Inserting",1);
add("Baum Folder","Bindery",10);
add("Cutters","Bindery",10);
add("ESP 400","Bindery",8);
add("MBO Units","Bindery",4);
add("Pick & Place","Affixing",3);
add("AT-112","Affixing",1);
add("Tabber","Affixing",7);
save();
}

// SAVE
function save(){ localStorage.setItem("data", JSON.stringify(data)); }

// LOGIN
function login(){
let u=user.value,p=pass.value;
if(users[u]&&users[u]===p){
loginDiv(false); render();
}else alert("Wrong login");
}

// SHOW APP
function loginDiv(show){
document.getElementById("login").style.display=show?"block":"none";
document.getElementById("app").style.display=show?"none":"block";
}

// RENDER
function render(){
let list=document.getElementById("list");
list.innerHTML="";
let types=[...new Set(Object.values(data).map(x=>x.type))];

let o=0,s=0,k=0;

types.forEach(t=>{
let wrap=document.createElement("div");
let btn=document.createElement("button");
btn.innerText=t;

let content=document.createElement("div");
content.className="content";

btn.onclick=()=>content.style.display=content.style.display==="block"?"none":"block";

Object.values(data).filter(x=>x.type===t).forEach(e=>{
let d=e.next?(new Date(e.next)-new Date())/86400000:999;
let st="OK",cl="ok";
if(d<0){st="OVERDUE";cl="overdue";o++}
else if(d<5){st="SOON";cl="soon";s++}
else{k++}

let div=document.createElement("div");
div.className="card machine";

let issues=e.issues.map(i=>`<div class="issue">${i}</div>`).join("");
let note=e.note?`<div class="issue"><b>Note:</b> ${e.note}</div>`:"";

div.innerHTML=`
<b>${e.name}</b> (${e.serial})<br>
<span class="status ${cl}">${st}</span><br>
${note}
${readOnly?"":`<input type="date" onchange="setDate('${e.serial}',this.value)">`}
${readOnly?"":`<button onclick="log('${e.serial}')">Log Issue / Parts</button>`}
${readOnly?"":`<button onclick="addNote('${e.serial}')">Add Note</button>`}
${issues}
`;

content.appendChild(div);
});

wrap.appendChild(btn);
wrap.appendChild(content);
list.appendChild(wrap);
});

overdue.innerText="Overdue: "+o;
soon.innerText="Due Soon: "+s;
ok.innerText="OK: "+k;

// hide add if QR mode
if(readOnly) document.getElementById("addBox").style.display="none";
}

// FUNCTIONS
function setDate(sn,v){ data[sn].next=v; save(); render(); }

function log(sn){
let t=prompt("Issue / Parts:");
if(!t)return;
data[sn].issues.push(new Date().toLocaleString()+" - "+t);
save(); render();
}

function addNote(sn){
let n=prompt("Tech note:");
if(!n)return;
data[sn].note=n;
save(); render();
}

function addMachine(){
if(!newName.value||!newSerial.value)return alert("Fill all");
data[newSerial.value]={name:newName.value,serial:newSerial.value,type:"Custom",next:"",issues:[]};
save(); render();
}

// PRINT
function printReport(){
let w=window.open("","");
let html="<h1>DMD Equipment Report</h1>";
Object.values(data).forEach(e=>{
html+=`<h3>${e.name} (${e.serial})</h3>
<p>Next: ${e.next||"N/A"}</p>
${(e.issues||[]).join("<br>")}
<hr>`;
});
w.document.write(html);
w.print();
}

// START
if(readOnly){ loginDiv(false); render(); }
else loginDiv(true);

</script>

</body>
</html>
